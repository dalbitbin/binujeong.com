<!-- ================= ARCHIVE SECTION ================= -->
<section class="archive-section">
  <div class="container">
    <h1 class="text-white text-center mb-1">TIMELINE</h1>
    <div class="text-center archive-subtitle">ARCHIVE</div>
    <br>
    <div class="row g-4 mt-2">
      <!-- LEFT: CALENDAR -->
      <div class="col-12 col-lg-6">
        <div class="calendar-card">
          <div class="calendar-header">
            <button class="cal-btn" id="cal-prev" aria-label="Previous month">
              <i class="bi bi-chevron-left"></i>
            </button>

            <h3 class="calendar-month" id="cal-month">MONTH YYYY</h3>

            <button class="cal-btn" id="cal-next" aria-label="Next month">
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>

          <div class="calendar-grid" id="cal-weekdays"></div>
          <div class="calendar-grid mt-1" id="cal-days"></div>

          <div class="archive-legend mt-3 px-3">
            <span class="legend-item">
              <span class="legend-dot dot-woobin"></span>
              <span data-i18n="archive_legend_woobin">WOOBIN</span>
            </span>

            <span class="legend-item">
              <span class="legend-dot dot-luminous"></span>
              <span data-i18n="archive_legend_luminous">LUMINOUS</span>
            </span>

            <span class="legend-item">
              <span class="legend-dot dot-anniv"></span>
              <span data-i18n="archive_legend_anniversary">ANNIVERSARY</span>
            </span>

            <span class="legend-item">
              <span class="legend-dot dot-concert"></span>
              <span data-i18n="archive_legend_concert">CONCERT</span>
            </span>

            <span class="legend-item">
              <span class="legend-dot dot-showcase"></span>
              <span data-i18n="archive_legend_showcase">SHOWCASE</span>
            </span>

            <span class="legend-item">
              <span class="legend-dot dot-live"></span>
              <span data-i18n="archive_legend_tiktok_live">TIKTOK LIVE</span>
            </span>
          </div>
        </div>
      </div>

      <!-- RIGHT: TIMELINE -->
      <div class="col-12 col-lg-6">
        <div class="archive-card">
          <div class="archive-era">
            <div class="archive-era-title text-center"><span data-i18n="archive_timeline_woobin">WOOBIN (전체 활동)</span><br>
              <span class ="sub-date" data-i18n="archive_timeline_woobin_years">(2019–현재)</span></div>
            <div id="timeline-solo"></div>
          </div>
        </div>

        <div class="archive-card mt-4">
          <div class="archive-era">
            <div class="archive-era-title text-center"><span data-i18n="archive_timeline_luminous">LUMINOUS (그룹 활동)</span><br>
              <span class ="sub-date">(2019-2025)</span></div>
            <div id="timeline-luminous"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
