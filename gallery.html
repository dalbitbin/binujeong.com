<!-- ================= Gallery SECTION ================= -->
<section class="gallery-section">
  <div class="container">
    <h1 class="text-white text-center mb-4">GALLERY</h1>
    <br><br>

    <!-- Gallery Grid -->
    <div class="row gx-3 gy-0" id="gallery-grid"></div>

    <!-- Pagination -->
    <nav>
      <ul class="pagination justify-content-center mt-3" id="gallery-pagination"></ul>
    </nav>

    <!-- Modal Carousel -->
    <!-- ================= GALLERY MODAL ================= -->
    <div class="modal fade gallery-modal" id="galleryModal" tabindex="-1">

      <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">

          <div class="modal-body">

            <!-- Carousel -->
            <div id="galleryCarousel" class="carousel slide" data-bs-ride="false">
              <div class="carousel-inner" id="carousel-inner"></div>
            </div>

            <!-- LEFT ARROW -->
            <button class="gallery-arrow left"
              data-bs-target="#galleryCarousel"
              data-bs-slide="prev">
              <i class="bi bi-chevron-left"></i>
            </button>

            <!-- RIGHT ARROW -->
            <button class="gallery-arrow right"
              data-bs-target="#galleryCarousel"
              data-bs-slide="next">
              <i class="bi bi-chevron-right"></i>
            </button>

            <!-- CLOSE BUTTON -->
            <button
              class="gallery-close"
              data-bs-dismiss="modal">
              CLOSE
            </button>

          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Image Viewer -->
    <div class="modal fade" id="mobileImageModal" tabindex="-1">
      <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">

          <div class="modal-body d-flex justify-content-center align-items-center position-relative p-0">

            <img id="mobileImageView" class="mobile-full-image">

            <button
              class="gallery-close"
              data-bs-dismiss="modal">
              CLOSE
            </button>

          </div>

        </div>
      </div>
    </div>

</section>
