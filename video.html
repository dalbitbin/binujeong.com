<script>
/* -------------------------------
   Elements
-------------------------------- */
const soloWrap = document.getElementById("solo-videos");
const luminousWrap = document.getElementById("luminous-videos");

const activeWrap = document.getElementById("active-video");
const activeIframe = document.getElementById("active-iframe");
const activeTitle = document.getElementById("active-title");
const activeDate = document.getElementById("active-date");

/* -------------------------------
   Helpers
-------------------------------- */
function ytThumb(id) {
  return `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
}

function ytEmbed(id) {
  return `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1`;
}

function isMobile() {
  return window.innerWidth <= 768;
}

/* Detect navigation type: reload vs back/forward vs normal */
function getNavType() {
  const navEntries = performance.getEntriesByType?.("navigation");
  if (navEntries && navEntries.length) return navEntries[0].type; // "reload" | "navigate" | "back_forward"
  // fallback (older browsers)
  if (performance.navigation) {
    return performance.navigation.type === 1 ? "reload" : "navigate";
  }
  return "navigate";
}

function scrollToActive(smooth = true) {
  const nav = document.querySelector(".hybrid-navbar");
  const navH = nav ? nav.offsetHeight : 0;
  const top = activeWrap.getBoundingClientRect().top + window.scrollY - navH - 16;
  window.scrollTo({ top, behavior: smooth ? "smooth" : "auto" });
}

function scrollToTop(smooth = false) {
  window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" });
}

/* -------------------------------
   Behavior: force top ONLY on hard refresh/reload
-------------------------------- */
(function handleReloadScroll() {
  const navType = getNavType();

  if (navType === "reload") {
    // On reload, prevent browser restoring old scroll position
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    // Ensure scroll happens after layout is ready
    window.addEventListener("load", () => scrollToTop(false), { once: true });
  } else {
    // For back/forward and normal navigate, let browser handle restoration naturally
    if ("scrollRestoration" in history) history.scrollRestoration = "auto";
  }
})();

/* -------------------------------
   Set active video (optionally scroll)
-------------------------------- */
function setActive(video, shouldScroll = true) {
  activeIframe.src = ytEmbed(video.youtube_id);
  activeTitle.textContent = video.title;
  activeDate.textContent = video.date;

  if (shouldScroll) scrollToActive(true);

  console.log("EMBED SRC:", ytEmbed(video.youtube_id), "RAW:", video.youtube_id);
}

/* -------------------------------
   Cards
-------------------------------- */
function makeCard(video) {
  const col = document.createElement("div");
  col.className = isMobile() ? "col-12" : "col-12 col-md-4";

  const inner = document.createElement("div");
  inner.className = "video-card";

  const wrapClass = isMobile() ? "video-list-item" : "";

  inner.innerHTML = `
    <div class="${wrapClass}">
      <div class="video-thumb">
        <img src="${ytThumb(video.youtube_id)}" alt="${video.title}">
      </div>
      <div class="mt-2 mt-md-2">
        <div class="video-card-title text-white">${video.title}</div>
        <div class="video-card-date">${video.date}</div>
      </div>
    </div>
  `;

  inner.addEventListener("click", () => setActive(video, true));

  col.appendChild(inner);
  return col;
}

function renderAll(videos, setDefaultActive = true) {
  soloWrap.innerHTML = "";
  luminousWrap.innerHTML = "";

  const solo = videos.filter(v => v.group === "solo");
  const luminous = videos.filter(v => v.group === "luminous");

  solo.forEach(v => soloWrap.appendChild(makeCard(v)));
  luminous.forEach(v => luminousWrap.appendChild(makeCard(v)));

  // On initial load, set default active WITHOUT scrolling
  if (setDefaultActive) {
    if (solo.length) setActive(solo[0], false);
    else if (luminous.length) setActive(luminous[0], false);
  }
}

/* -------------------------------
   Navbar click => scroll to top
   (targets links inside .hybrid-navbar)
-------------------------------- */
function wireNavbarScrollTop() {
  const nav = document.querySelector(".hybrid-navbar");
  if (!nav) return;

  nav.addEventListener("click", (e) => {
    const link = e.target.closest("a");
    if (!link) return;

    // If it's a normal left click (not new tab, not ctrl/cmd)
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

    // Optional: only do this for same-page anchors or your known nav links.
    // Most of the time it's fine to just scroll top for any navbar click.
    scrollToTop(true);
  });
}

/* -------------------------------
   Fetch + render
-------------------------------- */
wireNavbarScrollTop();

fetch("video.json")
  .then(r => r.json())
  .then(data => {
    renderAll(data, true);

    // Re-render on resize to update mobile/desktop layout,
    // BUT don't reset active/scroll every time.
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderAll(data, false), 150);
    });
  })
  .catch(err => console.error("Failed to load video.json:", err));
</script>
