<section class="video-section">
  <div class="container">

    <!-- Main Preview -->
    <div class="row mb-5" id="video-active">
      <div class="col-12">
        <iframe id="active-video" width="100%" height="700" src="" 
                title="Video preview" frameborder="0" allowfullscreen></iframe>
        <h3 class="text-white mt-3" id="active-title"></h3>
        <p class="text-white" id="active-desc"></p>
      </div>
    </div>

    <h1 class="text-white text-center mb-4">VIDEO</h1>
    <hr class="profile-divider mb-4">

    <!-- Grid preview -->
    <div class="row g-3" id="video-grid"></div>

    <!-- Pagination (optional) -->

  </div>

<!-- ================= SCRIPT ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>

  const videoGrid = document.getElementById("video-grid");
const activeVideo = document.getElementById("active-video");
const activeTitle = document.getElementById("active-title");
const activeDesc = document.getElementById("active-desc");
const paginationEl = document.getElementById("video-pagination");

let videoData = [];
let currentPage = 1;
const videosPerPage = 3;

// Fetch video JSON
fetch("video.json")
  .then(res => res.json())
  .then(data => {
    videoData = data;
    renderVideoPage();
    if (videoData.length > 0) setActiveVideo(videoData[0]);
    renderPagination();
  })
  .catch(err => console.error(err));

// Render grid
function renderVideoPage() {
  videoGrid.innerHTML = "";
  const start = (currentPage - 1) * videosPerPage;
  const end = start + videosPerPage;
  videoData.slice(start, end).forEach((video, index) => {
    const col = document.createElement("div");
    col.className = "col-12 col-md-4";
    col.innerHTML = `
      <div class="video-card cursor-pointer">
        <img src="https://img.youtube.com/vi/${video.youtube_id}/hqdefault.jpg" 
             class="img-fluid" alt="${video.title}">
        <h5 class="text-white mt-2">${video.title}</h5>
      </div>
    `;
    videoGrid.appendChild(col);

    // Click updates main preview
    col.querySelector("img").addEventListener("click", () => setActiveVideo(video));
  });
}

// Set active video in main preview
function setActiveVideo(video) {
  activeVideo.src = `https://www.youtube.com/embed/${video.youtube_id}`;
  activeTitle.textContent = video.title;
  activeDesc.textContent = video.desc;
}

// Pagination
function renderPagination() {
  if (!paginationEl) return;
  const totalPages = Math.ceil(videoData.length / videosPerPage);
  if (totalPages <= 1) {
    paginationEl.style.display = "none";
    return;
  }
  paginationEl.innerHTML = "";
  for (let i = 1; i <= totalPages; i++) {
    const li = document.createElement("li");
    li.className = `page-item ${i === currentPage ? "active" : ""}`;
    const a = document.createElement("a");
    a.className = "page-link";
    a.href = "#";
    a.textContent = i;
    a.addEventListener("click", e => {
      e.preventDefault();
      currentPage = i;
      renderVideoPage();
      renderPagination();
    });
    li.appendChild(a);
    paginationEl.appendChild(li);
  }
}

</script>
